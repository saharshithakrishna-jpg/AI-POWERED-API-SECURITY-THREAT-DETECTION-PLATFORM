spring.application.name=api-security-platform

server.port=${SPRING_PORT:8080}

# Database Config
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:api_security_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Config (Hibernate)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Prevents LazyInitializationException when lazy entities are accessed outside transactions (e.g. in filters)
spring.jpa.open-in-view=false

# JWT Secret
app.jwt.secret=${JWT_SECRET:this-is-a-very-long-secret-key-for-jwt-signing-do-not-use-in-prod}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ML Service URL
app.ml.service.url=${ML_SERVICE_URL:http://localhost:8000/predict}

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.apisecurity=DEBUG
